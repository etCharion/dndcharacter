<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND 2024 Character Sheet - Gimli Ironfist</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="punk-theme">
    <header>
        <div class="header-top">
            <div>
                <h1 id="char-name" class="editable" data-field="name">Gimli Ironfist</h1>
                <div id="header-info" class="header-info-bar"></div>
            </div>
            <div class="rest-buttons">
                <button id="rest-short">Short Rest</button>
                <button id="rest-long">Long Rest</button>
            </div>
        </div>
        <div id="compact-stats" class="compact-stats-bar"></div>
        <div id="combat-essentials" class="combat-essentials"></div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" data-tab="stats">Stats</button>
        <button class="tab-btn" data-tab="features">Features</button>
        <button class="tab-btn" data-tab="spells">Spells</button>
        <button class="tab-btn" data-tab="plans">Plans (Infusions)</button>
        <button class="tab-btn" data-tab="combat">Combat & Inv</button>
        <button class="tab-btn" data-tab="steel-defender">Steel Defender</button>
    </nav>

    <main id="tab-container">
        <!-- Stats Tab -->
        <section id="stats" class="tab-content active">
            <div id="stats-grid" class="stats-grid"></div>
            <div id="stats-extras" class="stats-extras"></div>
        </section>

        <!-- Features Tab -->
        <section id="features" class="tab-content">
            <div class="filter-row">
                <input type="text" id="feature-filter" placeholder="Filter features..." onkeyup="filterFeatures()">
                <div id="feature-category-filters" class="category-filters"></div>
            </div>
            <div id="features-list" class="features-list"></div>
        </section>

        <!-- Spells Tab -->
        <section id="spells" class="tab-content">
            <div id="spell-slots"></div>
            <div class="spell-filters">
                <div class="filter-row">
                    <input type="text" id="spell-filter" placeholder="Filter spells..." onkeyup="filterSpells()">
                    <div id="spell-category-filters" class="category-filters"></div>
                </div>
            </div>
            <div id="prepared-spells"></div>
            <hr>
            <div id="all-spells-list">
                <h3>Spellbook / All Known Spells</h3>
                <!-- List of all spells to prepare from -->
            </div>
        </section>

        <!-- Plans Tab -->
        <section id="plans" class="tab-content">
            <div class="plan-filters">
                <input type="text" id="plan-filter" placeholder="Filter plans..." onkeyup="filterPlans()">
            </div>
            <div id="prepared-plans"></div>
            <hr>
            <div id="all-plans-list">
                <h3>All Magic Item Plans</h3>
            </div>
        </section>

        <!-- Combat & Inventory Tab -->
        <section id="combat" class="tab-content">
            <div class="combat-grid">
                <div class="left-combat-column">
                    <div class="attacks-section">
                        <h3>Attacks</h3>
                        <div id="attacks-list"></div>
                        <button onclick="addCustomAttack()">+ Add Attack</button>
                    </div>
                    <div id="combat-actions" class="combat-actions-vertical">
                        <div class="action-category collapsed" id="category-actions">
                            <div class="category-header" onclick="toggleCategory('actions')">
                                <h3>Actions</h3>
                                <div class="category-controls">
                                    <label class="toggle-control" onclick="event.stopPropagation()">
                                        <input type="checkbox" id="toggle-common-actions" onchange="toggleCommonActions('actions')">
                                        <span>Show Common</span>
                                    </label>
                                    <span class="collapse-icon">▼</span>
                                </div>
                            </div>
                            <div id="actions-list" class="actions-container hidden"></div>
                        </div>
                        <div class="action-category collapsed" id="category-bonus-actions">
                            <div class="category-header" onclick="toggleCategory('bonus-actions')">
                                <h3>Bonus Actions</h3>
                                <div class="category-controls">
                                    <label class="toggle-control" onclick="event.stopPropagation()">
                                        <input type="checkbox" id="toggle-common-bonus-actions" onchange="toggleCommonActions('bonus-actions')">
                                        <span>Show Common</span>
                                    </label>
                                    <span class="collapse-icon">▼</span>
                                </div>
                            </div>
                            <div id="bonus-actions-list" class="actions-container hidden"></div>
                        </div>
                        <div class="action-category collapsed" id="category-reactions">
                            <div class="category-header" onclick="toggleCategory('reactions')">
                                <h3>Reactions</h3>
                                <div class="category-controls">
                                    <label class="toggle-control" onclick="event.stopPropagation()">
                                        <input type="checkbox" id="toggle-common-reactions" onchange="toggleCommonActions('reactions')">
                                        <span>Show Common</span>
                                    </label>
                                    <span class="collapse-icon">▼</span>
                                </div>
                            </div>
                            <div id="reactions-list" class="actions-container hidden"></div>
                        </div>
                    </div>
                </div>
                <div class="inventory-section">
                    <h3>Inventory & Equipment</h3>
                    <div id="money-display"></div>
                    <div id="inventory-list"></div>
                    <button onclick="addInventoryItem()">+ Add Item</button>
                </div>
            </div>
        </section>

        <!-- Steel Defender Tab -->
        <section id="steel-defender" class="tab-content">
            <div id="sd-info"></div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
