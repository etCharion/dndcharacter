<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 2024 Character Sheet - Forge Artificer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="punk-theme">
    <header class="main-header">
        <div class="char-basic-info">
            <h1 id="char-name">Character Name</h1>
            <p><span id="char-race">Race</span> | <span id="char-class">Class</span> <span id="char-level">0</span></p>
        </div>
        <div class="vitals-bar">
            <div class="vital-item hp">
                <label>HP</label>
                <input type="number" id="hp-current" value="0"> / <span id="hp-max">0</span>
            </div>
            <div class="vital-item ac">
                <label>AC</label>
                <span id="ac-value">0</span>
            </div>
            <div class="vital-item proficiency">
                <label>PROF</label>
                <span id="prof-bonus">+0</span>
            </div>
        </div>
    </header>

    <main class="grid-container">
        <!-- Sidebar: Stats & Skills -->
        <aside class="sidebar">
            <section id="stats-container" class="panel">
                <h2>Attributes</h2>
                <div class="stats-grid"></div>
            </section>
            <section id="skills-container" class="panel">
                <h2>Skills</h2>
                <div class="skills-list"></div>
            </section>
        </aside>

        <!-- Main Content: Features & Spells -->
        <section class="content-area">
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="features">Features</button>
                <button class="tab-btn" data-tab="spells">Spells</button>
                <button class="tab-btn" data-tab="combat">Combat & Inventory</button>
                <button class="tab-btn" data-tab="defender">Steel Defender</button>
            </nav>

            <div id="features-tab" class="tab-content active">
                <div class="filter-bar">
                    <input type="text" id="feature-search" placeholder="Filter features...">
                    <select id="feature-source-filter">
                        <option value="all">All Sources</option>
                        <option value="Artificer">Artificer</option>
                        <option value="Subclass">Subclass</option>
                    </select>
                </div>
                <div id="features-list"></div>
            </div>

            <div id="spells-tab" class="tab-content">
                <div class="spell-slots-container">
                    <h3>Spell Slots</h3>
                    <div id="slot-trackers"></div>
                </div>
                <div id="spells-list"></div>
            </div>

            <div id="combat-tab" class="tab-content">
                <section id="attacks-section">
                    <h3>Attacks</h3>
                    <div id="attacks-list"></div>
                </section>
                <div class="currency-bar">
                    GP: <input type="number" id="gp-val" class="coin-input">
                    SP: <input type="number" id="sp-val" class="coin-input">
                    CP: <input type="number" id="cp-val" class="coin-input">
                </div>
                <section id="inventory-section">
                    <h3>Inventory</h3>
                    <div id="inventory-list"></div>
                    <button id="add-item-btn" class="punk-btn" onclick="addNewItem()">+ Add Item</button>
                </section>
            </div>

            <div id="defender-tab" class="tab-content">
                <div id="defender-stats" class="panel">
                    <h3>Iron Guardian</h3>
                    <p>AC: 16 | HP: <input type="number" id="defender-hp" value="35"> / 35</p>
                    <p>Speed: 40ft</p>
                    <div id="defender-actions"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="data/character.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
